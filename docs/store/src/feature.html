<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Bricolage; src: url("file:///C:/Users/AmanSharma/Desktop/Aurio/app/src/main/res/font/bricolage_grotesque.ttf"); font-weight: 200 800; }
  @font-face { font-family: Onest; src: url("file:///C:/Users/AmanSharma/Desktop/Aurio/app/src/main/res/font/onest.ttf"); font-weight: 100 900; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #F6F6F3; }
  .stage { position: relative; width: 1024px; height: 500px; overflow: hidden; }
  /* The aura: soft blobs in the Radiant palette (pink, yellow, mint, orange). */
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .9; }
  .b1 { width: 520px; height: 520px; left: -120px; top: -180px; background: #FF9EC7; }
  .b2 { width: 480px; height: 480px; left: 300px; top: 180px; background: #FFE27A; }
  .b3 { width: 520px; height: 520px; left: 640px; top: -200px; background: #9FF0CF; }
  .b4 { width: 360px; height: 360px; left: 820px; top: 260px; background: #FFB27A; }
  .grain { position: absolute; inset: 0; opacity: .18; mix-blend-mode: multiply;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .content { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 44px; }
  .tile { width: 168px; height: 168px; border-radius: 40px; overflow: hidden; position: relative;
          box-shadow: 0 18px 40px rgba(23,22,28,.18);
          background: radial-gradient(circle at 20% 20%, #FF9EC7 0%, #FFE27A 55.5%, #9FF0CF 111%); }
  .tile svg { position: absolute; inset: 0; }
  .words { color: #17161C; }
  .name { font-family: Bricolage; font-weight: 800; font-size: 132px; letter-spacing: -6px; line-height: .9; }
  .tag { font-family: Onest; font-weight: 500; font-size: 34px; margin-top: 18px; letter-spacing: -.3px; }
</style></head>
<body>
  <div class="stage">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
    <div class="grain"></div>
    <div class="content">
      <div class="tile">
        <svg width="168" height="168" viewBox="18 18 72 72">
          <path d="M35,42L44,67L54,49L64,67L73,42" fill="none" stroke="#17161C" stroke-width="7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="words">
        <div class="name">Waura</div>
        <div class="tag">Take the W on screen time.</div>
      </div>
    </div>
  </div>
</body></html>
